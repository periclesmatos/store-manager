# ================================
# BANCO DE DADOS H2 IN-MEMORY PARA TESTES
# Banco de dados em memória para testes, que é criado e destruído a cada execução
# ================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto específico para H2 no Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ================================
# CONFIGURAÇÕES JPA / HIBERNATE
# ================================
# Cria o esquema ao iniciar e destrói ao terminar (ideal para testes)
spring.jpa.hibernate.ddl-auto=create-drop

# Desliga a exibição das queries SQL no console
spring.jpa.show-sql=false
hibernate.show_sql=false

# Desliga o formatador e comentários SQL para evitar logs desnecessários
spring.jpa.properties.hibernate.format_sql=false
hibernate.format_sql=false
hibernate.use_sql_comments=false

# ================================
# CONFIGURAÇÕES PARA SILENCIAR LOGS SQL E DDL
# Controla o nível dos logs para evitar mensagens SQL detalhadas no console
# ================================
logging.level.root=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.engine.jdbc.batch=OFF
logging.level.org.hibernate.tool.schema.internal=OFF
logging.level.org.hibernate.tool.hbm2ddl=OFF
logging.level.org.springframework.jdbc.core=OFF

# Propriedades extras para garantir que o Hibernate não mostre SQL no console diretamente
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.show_sql=false

# ================================
# DESLIGAR BANNER DO SPRING BOOT NOS TESTES
# ================================
spring.main.banner-mode=off



