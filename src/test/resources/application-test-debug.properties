# ================================
# LOGGING PARA DEBUG DE TESTES
# ================================

# Log geral só erros para não poluir
logging.level.root=ERROR

# Mostra as queries SQL executadas pelo Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Mostra os valores dos parâmetros bind nas queries SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Habilita mostrar SQL no console
spring.jpa.show-sql=true

# Formata o SQL para melhor leitura
spring.jpa.properties.hibernate.format_sql=true

# Desliga comentários SQL que poluem o log
spring.jpa.properties.hibernate.use_sql_comments=false
